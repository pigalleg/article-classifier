version: 2
title: Affinity Scoring Scale
targets:
  RA:
    1: >-
      Score the abstract’s relevance to the research question from 0–120 using these ranges: 1–40 = Low relevance (0 = no relevance; topics may be tangentially related but do not directly address the questions’s goals); 41–80 = Moderate relevance (clear connection, but not central—e.g., focuses on methods or secondary aspects rather than the questions’s core problem); 81–120 = High relevance (directly and substantially addresses the questions’s main objectives).
    2: >-
      Score the abstract’s relevance to the research question from 0–120 using these ranges:

      Low
      ∎ 0-20: No conceptual overlap. The abstract addresses a completely different topic, phenomenon or research domain. There are no shared concepts, methods, or outcomes. Any superficial keyword match is coincidental. The abstract would not appear in a literature review for this question under any reasonable interpretation.

      ∎ 20-40: Marginal overlap. One or two terms or concepts are shared but the abstract investigates a fundamentally different question. The research domain may be adjacent but the objectives, topic, or outcomes are misaligned. Findings from this abstract could not be used to inform an answer to the question even partially. A reader would not cite this abstract as background for the question.

      Moderate
      ∎ 40-60: Contextual overlap. The abstract shares the general domain and studies a related concept or phenomenon, but targets a different outcome, phenomenon, or objective. The abstract provides useful background or framing but cannot directly answer the question. A reader might cite it to establish context but not as evidence.

      ∎ 60-80: Partial evidence. The abstract addresses the same research objective as the question but in a different area, context, or with a different methodological framework. Findings are relevant but require adaptation or extrapolation to apply to the question. A reader would cite this abstract as indirect or supporting evidence, not as a primary source.

      High
      ∎ 80-100: Direct relevance. The abstract addresses the same question, phenomenon, and outcome. Minor differences in methodology, setting, or scope exist but do not prevent the findings from being directly applicable. A reader would cite this abstract as substantive evidence for answering the question.

      ∎ 100-120: Near-perfect match. The abstract is a primary source for the question. It addresses the same research question, phenomenon, outcome, and context. Its findings can be applied directly, without adaptation, to answer the question. A reader would cite this abstract as primary evidence.
  PRP:
    1: >-
      Score the abstract’s relevance to the program from 0–120 using these ranges: 1–40 = Low relevance (0 = no relevance; topics may be tangentially related but do not directly address the program’s goals); 41–80 = Moderate relevance (clear connection, but not central—e.g., focuses on methods or secondary aspects rather than the program’s core problem); 81–120 = High relevance (directly and substantially addresses the program’s main objectives).
