    target_type: RA
    abstract: >-
      power systems with high penetration of renewable energy contain various uncertainties. scenario-based optimization problems need a large number of discrete scenarios to obtain a reliable approximation for the probabilistic model. it is important to choose typical scenarios and ease the computational burden. this paper presents a scenario reduction network model based on wasserstein distance. entropy regularization is used to transform the scenario reduction problem into an unconstrained problem. through an explicit neural network structure design, the output of the scenario reduction network corresponds to the sinkhorn distance function. the scenario reduction network can generate the typical scenario set through unsupervised learning. an efficient algorithm is proposed for continuous/discrete scenario reduction. the superiority of the scenario reduction network model is verified through case studies. the numerical results highlight the high accuracy and computational efficiency of the proposed model over state-of-the-art models, and it makes an ideal candidate for large-scale scenario reduction problems.
