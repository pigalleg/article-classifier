examples:
  - id: id_20
    target_type: RA
    abstract: >-
      To integrate weak onshore grids, some grid forming (gfm) control schemes taking advantage of dc voltage synchronization have been proposed for modular multilevel converter-based high-voltage direct current (mmc-hvdc) systems. in these control schemes, the sub-module (sm) capacitor energy is only used for grid synchronization. since the sm capacitor is an energy storage device, it has the potential to actively regulate the stored energy. to fully exploit the energy management capability of mmc, a dual grid forming control scheme with energy regulation capability is presented in this paper. the proposed control scheme enables grid forming for both onshore and offshore mmc stations. meanwhile, the capacitor energy of mmcs can be flexibly regulated to provide frequency support for the onshore grid. to verify the effectiveness of the proposed control scheme, case studies are first carried out in a point-to-point offshore wind farms (owfs) integrated hvdc system. in addition, the frequency support performance is evaluated in a 3-area 4-machine grid integrated with two owfs-hvdc systems. finally, a single-terminal three-phase mmc prototype is developed to test the voltage decoupling and energy management capabilities of the proposed control strategy.
    targets:
      - target_id: "4"
        score: 108
        rationale: Directly develops inverter (MMC) control design for high-IBR grids.
      - target_id: "10"
        score: 84
        rationale: Examines grid-forming roles in HVDC-connected systems. Allthough, it does not directly determine appropiate mix, location or capabilities of grid-forming and grid-following inverters to mitigate stability problems.
      - target_id: "29"
        score: 72
        rationale: Maps MMC capabilities to frequency support service provision.
      - target_id: "14"
        score: 0
        rationale: No communication requirements addressed.

  - id: id_25
    target_type: RA
    abstract: >-
      This paper introduces a new fault location method for hybrid ac/dc complex transmission grids containing distributed energy resources (ders) and modular multilevel converter-high voltage direct current (hvdc) lines. digital fault recorders (dfr) in the dc grid cannot observe faults occurring in the ac network and vice-versa. the proposed algorithm accurately locates faults irrespective of their location using a subset of dfrs selected by a k-means clustering method. the algorithm is tested using an ac/dc complex transmission network formed by merging the modified ieee 39 bus transmission system and the cigre b4 dc grid test systems under several fault conditions using emtp-rv and matlab as simulation tools.
    targets:
      - target_id: "2"
        score: 114
        rationale: Directly proposes fault location method for protection in AC/DC grids.
      - target_id: "25"
        score: 72
        rationale: Uses measurements relevant to system monitoring metrics. It can be potentially useful for situational awareness, but the paper does not directly address this application or its requirements.
      - target_id: "19"
        score: 40
        rationale: Fault location can aid operational decision-making, however, the abstract is not directly focused on decision-making tools or processes.
  - id: id_34
    target_type: RA
    abstract: >-
      The uncertainty of electricity prices poses a challenge to all market participants as their decisions highly depend on the accuracy of price forecasts. prediction intervals become an efficient method to quantify the uncertainties that reside in electricity price forecasts. in this paper, we propose a probabilistic electricity price forecast with optimal prediction interval method that considers both reliability and sharpness requirements. taking reliability and sharpness into account, we ensure the prediction interval has a narrow width without sacrificing reliability. in the proposed method, the quantile regression is utilized to estimate the upper and lower bounds of the prediction intervals to avoid electricity price distribution assumption. in addition, the extreme learning machine (elm) method is embedded in the forecast method to capture the nonlinear relationship within price data, and its tuning parameters are optimized using the augmented lagrangian relaxation method in this paper. the effectiveness of the proposed probabilistic forecast method is demonstrated using data from various electricity markets.
    targets:
      - target_id: "1"
        score: 0
        rationale: No relation to active power balance or frequency
      - target_id: "30"
        score: 5
        rationale: Allthouh the paper related to system performance forecasting, it does not directly translates it into new technology solutions.
      - target_id: "23"
        score: 49
        rationale: Integrated data and analytics for operational insight. However, market data analytics might be less relevant for real-time situational awareness and decision-making in control rooms compared to physical system monitoring and forecasting.
      - target_id: "27"
        score: 60
        rationale: It uses one kind of probabilities forecasting for electricity prices which could be used into operational decision support. Howver, market data might be less relevant for real-time situational awareness and decision-making in control rooms compared to physical system monitoring and forecasting.
# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=11 question_id=22
# Ministral affinity level: Low (10.0)
# Sub-band: 0-20; anchor model: ministral-3-14b-cloud
  - id: id_11
    target_type: RA
    abstract: >-
      the integration of modern power systems with information and communication technologies exposes them to various cyber threats. load frequency control (lfc) is a communication-based automation in power systems that regulates the frequency of the grid. its critical role makes it a highly attractive target for adversaries. this paper proposes a novel detection and isolation method of false data injection attacks (fdias) against lfc. the defense method employs sliding mode observation techniques to detect fdias against lfc in real-time and discover which parts of the control loop have been compromised. attacks are identified by comparing the generated residuals with a specific threshold that is designed in an adaptive manner. the proposed method is able to successfully distinguish the fdias from other system disturbances and is robust against uncertainties in power system parameters and noisy measurements. the effectiveness and scalability of the proposed defense method are confirmed on realistic power system models, considering nonlinearities, different topologies and diverse types of transmission links.
    targets:
      - target_id: "22"
        score: 10
        rationale: >-
          No focus on digital architecture for control room modularity or automation.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=48 question_id=3
# Ministral affinity level: Low (0.0)
# Sub-band: 0-20; anchor model: ministral-3-14b-cloud
  - id: id_48
    target_type: RA
    abstract: >-
      in multi-infeed lcc-hvdc (midc) systems, voltage collapse becomes a concern as dc power increases, and its proximity to the stability boundary is challenging to define precisely. consequently, there is a growing focus on identifying the direction in which dc power destabilizes the midc systems most rapidly. to address the above issue, this letter introduces an iterative method for locating the closest saddle-node bifurcation (snb) point in the midc power space, utilizing the concept of the generalized short-circuit ratio (gscr) to represent grid strength. it is demonstrated that the right eigenvector corresponding to the gscr possesses the capability to construct the normal vector of the stability boundary in the power space. when the iterative process converges, this normal vector aligns with the worst-case instability direction. additionally, the method computes the euclidean distance from the current operating point to the closest snb point. case studies are provided to demonstrate the effectiveness of the proposed method.
    targets:
      - target_id: "3"
        score: 0
        rationale: >-
          No focus on IBR control paradigm shifts or flexibility exploitation.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=9 question_id=46
# Ministral affinity level: Low (35.0)
# Sub-band: 21-40; anchor model: ministral-3-14b-cloud
  - id: id_9
    target_type: RA
    abstract: >-
      electromagnetic transient (emt) simulation is critical and fundamental in the design and operation of the modular multilevel converter (mmc). this article proposes a highly efficient emt simulation model for mmc based on hybrid numerical integration. the topology and operational principle of mmc are elaborated first. based on this, an efficient simulation model for mmc is proposed. each arm of the mmc is reduced to a two-node norton equivalent circuit in the main network simulation. the computation of the capacitor dynamic equations is decoupled from that of the arm inductor dynamic equation. they are computed in a leapfrog manner. this makes the equivalent conductance of the mmc arm constant and greatly improves the simulation efficiency. moreover, the dynamic equations of the capacitors are also decoupled from each other. various operational conditions of the mmc are also considered, and accuracy and adaptability are thus ensured. extensive studies on power systems with different scales verify the accuracy and improved efficiency of the proposed emt simulation model for mmc.
    targets:
      - target_id: "46"
        score: 35
        rationale: >-
          Indirectly relevant (resilience via frequency security) but no explicit resilience planning.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=7 question_id=45
# Ministral affinity level: Low (25.0)
# Sub-band: 21-40; anchor model: ministral-3-14b-cloud
  - id: id_7
    target_type: RA
    abstract: >-
      in this paper, we present and study a robust unit commitment model and some variants that consider complex temperature and demand uncertainties. since there is a strong relationship among the efficiency of gas generators, demand, and temperature in practical systems, our robust models have both left- and right-hand-side (lhs and rhs, respectively) uncertainties. unlike many existing robust models with rhs uncertainty only, the introduction of lhs uncertainty imposes a huge challenge in computing robust solutions. for those complex formulations, we analyze their structures, derive important properties, and design exact and fast approximation solution strategies under the column-and-constraint generation framework. numerical experiments are conducted on typical ieee test systems, which showcase the great performance of our solution methods and demonstrate a clear impact of complex and correlated uncertainties in system operations.
    targets:
      - target_id: "45"
        score: 25
        rationale: >-
          Uncertainty modeling is relevant but does not address electrification-specific load/resource forecasting.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=65 question_id=25
# Ministral affinity level: Moderate (60.0)
# Sub-band: 41-55; anchor model: ministral-3-14b-cloud
  - id: id_65
    target_type: RA
    abstract: >-
      the integration of numerous energy storage systems (esss) improves the reliable and economic operation of microgrids but also enlarges the burden of control and communication systems. this article proposes a cooperative hierarchical control for isolated microgrids with esss, which fully frees from the centralized paradigm and is therefore superior in flexibility and scalability. firstly, the ess cooperative control based on the distributed frequency controller is introduced for the state of charge (soc) balance and the frequency regulation. then, the ess aggregation is considered. the aggregated ess model is established and the real-time model parameters are derived by proposed distributed state observers. finally, energy management is employed to allocate the output power between generators and the aggregated ess. a detailed theoretical analysis of the dynamic and steady-state performance of proposed controllers and observers is provided. simulations on the ieee 33-bus and the 69-bus system verify the effectiveness of proposed methods.
    targets:
      - target_id: "25"
        score: 60
        rationale: >-
          Distributed observers provide real-time monitoring but not explicitly for dynamic behavior metrics.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=94 question_id=9
# Ministral affinity level: Moderate (72.0)
# Sub-band: 56-70; anchor model: ministral-3-14b-cloud
  - id: id_94
    target_type: RA
    abstract: >-
      with the increasing deployment of distributed energy resources (ders), dispatching ders subject to operational constraints in distribution networks draws much attention. one challenge is the non-convexities in 1) system-wide ac power flow constraints and 2) the individual complementarity constraint of energy storage. to resolve this challenge, this paper studies an ac-feasible linear model in distribution networks with energy storage, including its formulation, analysis, and applications. first, an ac-feasible linear model is formulated as a set of linear constraints on controllable ders and uncontrollable power demand by 1) converting the non-convex system-wide constraints into linear constraints based on the brouwers fixed-point theorem and the second-order taylor expansion, and 2) replacing the non-convex individual complementarity constraint of energy storage with one properly designed linear constraint. furthermore, to analyze the power demand level at which the proposed linear model can provide a solution, this paper proposes an examination-based projection method under the monte carlo framework to handle projections of thousands of dimensions from linear constraints over time periods. finally, the potential applications of our ac-feasible linear model are discussed. numerical experiments are conducted in the ieee 33-bus and 136-bus test systems to demonstrate the effectiveness of the proposed methods.
    targets:
      - target_id: "9"
        score: 72
        rationale: >-
          Linear models provide planning tools but lack robust performance assessment.

# Added by populate_few_shot_ra_from_ministral_examples.py
# Source: ministral_anchored_examples.csv row abstract_id=53 question_id=25
# Ministral affinity level: Moderate (78.0)
# Sub-band: 56-70; anchor model: ministral-3-14b-cloud
  - id: id_53
    target_type: RA
    abstract: >-
      this article presents a temperature-dependent three-phase power system state estimation method in which the bus voltage phasor and line conductor temperature are considered as state variables. the heat-balance conditions of the overhead lines and underground cables are integrated into the state estimation problem. to improve the robustness of the estimation results, the objective function of the constrained optimization problem is based on the schweppe-type huber generalized maximum-likelihood (shgm) estimator. a solution strategy based on an alternating optimization approach has been proposed. the method begins by estimating the voltage phasors of all buses while keeping the line conductor temperatures fixed to their present values. the optimization then uses the estimated voltage phasors and environmental information around all transmission lines to estimate the conductor temperature variables. these two optimization stages are alternatively repeated until the convergence conditions are satisfied. the effectiveness of the proposed state estimation has been demonstrated on ieee 30-bus and 118-bus systems modified as three-phase systems containing both overhead lines and buried underground cables. the results show that the proposed method can provide good estimated state accuracy and reduce the computational burden.
    targets:
      - target_id: "25"
        score: 78
        rationale: >-
          Monitors dynamic behavior via voltage phasors/power injections but no explicit metrics definitions.

