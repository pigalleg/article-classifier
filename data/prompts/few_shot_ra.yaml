# Source: ministral_anchored_examples.csv row abstract_id=9 question_id=46
# Ministral affinity level: Low (35.0)
# Sub-band: 21-40; anchor model: ministral-3-14b-cloud
  - id: id_9
    target_type: RA
    abstract: >-
      electromagnetic transient (emt) simulation is critical and fundamental in the design and operation of the modular multilevel converter (mmc). this article proposes a highly efficient emt simulation model for mmc based on hybrid numerical integration. the topology and operational principle of mmc are elaborated first. based on this, an efficient simulation model for mmc is proposed. each arm of the mmc is reduced to a two-node norton equivalent circuit in the main network simulation. the computation of the capacitor dynamic equations is decoupled from that of the arm inductor dynamic equation. they are computed in a leapfrog manner. this makes the equivalent conductance of the mmc arm constant and greatly improves the simulation efficiency. moreover, the dynamic equations of the capacitors are also decoupled from each other. various operational conditions of the mmc are also considered, and accuracy and adaptability are thus ensured. extensive studies on power systems with different scales verify the accuracy and improved efficiency of the proposed emt simulation model for mmc.
    targets:
      - target_id: "46"
        score: 35
        rationale: >-
          Indirectly relevant (resilience via frequency security) but no explicit resilience planning.

