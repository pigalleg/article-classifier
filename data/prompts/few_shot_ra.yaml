    target_type: RA
    abstract: >-
      this article investigates the maximum transferable power (mtp) of inverter-based resources (ibrs) and provides the output capability curves (occs) of grid-tied grid-following inverters (gflis) and grid-forming inverters (gfmis). to this end, in the first part of the article, mathematical equations for gfli static, thermal, and phase-locked loop (pll)-induced power transfer limits are derived in terms of the grid short-circuit ratio (scr) and its x/r ratio. then, considering other operational limitations, such as the ibr ac- and dc-side voltage limits, the occ of the gfli is obtained. additionally, the impact of the reactive current and the reactive control mode on the occ is further studied, and accordingly, an auxiliary control loop is proposed to maximize the gfli mtp. in the second part of the article, a similar approach is employed to derive mathematical equations for gfmi static and thermal limits, and accordingly, the occ of a gfmi is obtained. the effects of the variation of the voltage set-point of the gfmi on its occ are then studied, and the superiority of gfmis compared to gflis is shown in terms of the mtp capability. eventually, several simulation and experimental cases are conducted to validate the obtained equations and occs for both grid-following and grid-forming control modes.
